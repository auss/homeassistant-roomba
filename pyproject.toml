[project]
name = "homeassistant-roomba"
version = "0.1.0"
description = "Home Assistant custom integration for Roomba local MQTT control"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "paho-mqtt>=2.1.0,<3",
  "pillow>=11",
]

[project.optional-dependencies]
test = [
  "pytest==8.3.5",
  "pytest-asyncio==0.25.3",
  "ruff==0.11.2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["custom_components", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
